# تنظیمات logrotate برای error.log بات‌ساز
# نصب: sudo cp botsaz-logrotate.conf /etc/logrotate.d/botsaz
# تست دستی (بدون صبر تا فردا): sudo logrotate -f /etc/logrotate.d/botsaz
#
# نکته: مسیر فایل لاگ رو با مسیر واقعی error.log روی سرورت جایگزین کن.

/opt/botsaz/error.log {
    daily                   # هر روز چک/روتیت شود
    rotate 2                # فقط ۲ نسخهٔ قبلی نگه‌داری شود (باقی حذف می‌شوند)
    maxsize 50M             # اگر حتی در همون روز به ۵۰ مگ رسید، زودتر روتیت شود
    compress                # نسخه‌های قدیمی gzip شوند (فضای کمتر)
    delaycompress           # نسخهٔ دیروز فشرده نشود (برای بررسی سریع در صورت نیاز)
    missingok               # اگر فایل نبود، خطا ندهد
    notifempty              # اگر فایل خالی بود، روتیت نکند
    copytruncate            # فایل کپی و بعد خالی (truncate) شود؛ سرویس نیازی به
                            # ری‌استارت شدن ندارد و همچنان به همان فایل می‌نویسد
}
