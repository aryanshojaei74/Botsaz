# نمونهٔ nginx برای مسیریابیِ دو سرویسِ جدا (بات‌ساز روی 8000، مستأجرها روی 8001).
# این فقط بخشِ location هاست؛ داخلِ server{} فعلیِ خودت (همون که SSL/domain
# رو داره) جایگزین/اضافه کن. ترتیب مهمه: مسیرهای دقیق‌تر (=) باید بالاتر بیان.

upstream botsaz_platform { server 127.0.0.1:8000; }
upstream botsaz_tenant   { server 127.0.0.1:8001; }

# --- بات‌ساز (پلتفرم) ---
location = /webhook/platform {
    proxy_pass http://botsaz_platform;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location = /nowpay/platform/ipn {
    proxy_pass http://botsaz_platform;
}

# --- مستأجرها (هر مسیرِ /webhook/{token} دیگه) ---
location ~ ^/webhook/ {
    proxy_pass http://botsaz_tenant;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location = /nowpay/ipn {
    proxy_pass http://botsaz_tenant;
}

# --- مشترک: هرکدوم جواب بدن فرقی نداره (هر دو pay_router رو include کردن) ---
location ~ ^/pay/ {
    proxy_pass http://botsaz_tenant;
}

# --- صفحاتِ وب مخصوصِ مستأجر (مشاهدهٔ کانفیگ/آموزش) ---
location ~ ^/(view|tutorial|swap-pay)/? {
    proxy_pass http://botsaz_tenant;
}

# --- health چک هرکدوم رو جدا می‌خوای مانیتور کنی ---
location = /health/platform {
    proxy_pass http://botsaz_platform/health;
}
location = /health/tenant {
    proxy_pass http://botsaz_tenant/health;
}
