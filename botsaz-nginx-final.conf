server {
    server_name botsaz.mobitek.shop;

    # --- بات‌ساز (پلتفرم) — main_platform.py روی پورت ۸۰۰۰ ---
    location = /webhook/platform {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /nowpay/platform/ipn {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health/platform {
        proxy_pass http://127.0.0.1:8000/health;
    }

    # --- بات‌های مستأجر — main_tenant.py روی پورت ۸۰۰۱ ---
    # هر /webhook/{token} دیگه‌ای (غیر از /webhook/platform که بالاتر با =
    # مسیریابیِ دقیق گرفته شد) میاد اینجا
    location ~ ^/webhook/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /nowpay/ipn {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health/tenant {
        proxy_pass http://127.0.0.1:8001/health;
    }

    # --- مشترک (صفحهٔ پرداخت ارز دیجیتال؛ هر دو سرویس pay_router رو دارن) ---
    location ~ ^/pay/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- هرچیزِ دیگه (صفحاتِ وب مستأجر، /swap-pay، و پیش‌فرض) → تنانت ---
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/botsaz.mobitek.shop/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/botsaz.mobitek.shop/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = botsaz.mobitek.shop) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name botsaz.mobitek.shop;
    return 404; # managed by Certbot


}
